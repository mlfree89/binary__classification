name: class_app

services:
  # 1. FastAPI
  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - ml-network
    restart: unless-stopped

  # 2. PostgreSQL
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mahmoud}
      POSTGRES_USER: ${POSTGRES_USER:-mahmoud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ml-network
    restart: unless-stopped

  # 3. MLflow
  mlflow:
    build:
      context: ./services/mlflow
    env_file:
      - .env
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-mahmoud}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mahmoud}
      MLFLOW_ARTIFACTS_DESTINATION: s3://mlflow-artifacts
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "5001:5000"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--allowed-hosts", "mlflow,mlflow:5000,localhost,localhost:5001"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - ml-network
    restart: unless-stopped

  # 4. Trainer: starts only on demand
  trainer:
    build:
      context: .
      dockerfile: services/trainer/dockerfile
    profiles:
      - jobs
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: datasets
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PUSHGATEWAY_URL: http://pushgateway:9091
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - /mnt/c/Users/mahmo/Desktop:/data:ro
    depends_on:
      mlflow:
        condition: service_started
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      pushgateway:
        condition: service_started
    networks:
      - ml-network
    restart: "no"

  # 5. Evidently drift monitoring
  evidently:
    build:
      context: ./evidently_monitoring
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRAINING_TRIGGER_URL: http://training-trigger:8000/train
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: datasets
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      training-trigger:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - ml-network
    restart: unless-stopped

  # 6. MinIO object storage
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ml-network
    restart: unless-stopped

  # Helper: fix MinIO volume permissions
  minio-permissions:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 65532:65532 /data"]
    volumes:
      - minio_data:/data
    restart: "no"

  # 7. Prometheus
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus_monitoring:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ml-network
    restart: unless-stopped

  # 8. Pushgateway
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    volumes:
      - pushgateway_data:/data
    networks:
      - ml-network
    restart: unless-stopped

  # 9. cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8080:8080"
    networks:
      - ml-network
    restart: unless-stopped

  # 10. PostgreSQL exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-mahmoud}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mahmoud}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    networks:
      - ml-network
    restart: unless-stopped

  # 11. Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - ml-network
    restart: unless-stopped

  # 12. Training trigger HTTP server
  training-trigger:
    build:
      context: ./training_trigger
    environment:
      COMPOSE_PROJECT_DIR: /home/mahmo/class_app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/home/mahmo/class_app:ro
    networks:
      - ml-network
    restart: unless-stopped
   
      
  # Optional: Grafana
  grafana:
    image: grafana/grafana:latest
    profiles:
      - visualization
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - ml-network
    restart: unless-stopped

networks:
  ml-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  pushgateway_data:

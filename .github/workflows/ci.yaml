name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-evidently:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidently_monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  test-services-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  test-services-trainer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

  test-training-trigger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training_trigger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v

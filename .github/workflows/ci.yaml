
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test-evidently:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidently_monitoring
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v


  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      PYTHONPATH: ${{ github.workspace }}/services/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v


  test-trainer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trainer
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v


  test-training-trigger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training_trigger
    env:
      PYTHONPATH: ${{ github.workspace }}/training_trigger

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v

